<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music Directors - Malayalam Music</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#202124}header{padding:16px 18px;border-bottom:1px solid #e8eaed}.wrap{max-width:1100px;margin:auto}.logo{font-size:22px;font-weight:bold;color:#168653;text-decoration:none}nav{display:flex;gap:16px;margin-top:12px}nav a{color:#444;text-decoration:none;font-size:14px}main{max-width:1100px;margin:auto;padding:24px 18px}h1{font-size:22px}input{width:100%;padding:12px;border:1px solid #e8eaed;border-radius:10px;margin:6px 0 18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:1px solid #e8eaed;border-radius:12px;overflow:hidden}.cover{width:100%;aspect-ratio:1;object-fit:cover;background:#eee}.info{padding:12px}.name{font-weight:bold;color:#202124;text-decoration:none}.sub{font-size:12px;color:#73777d;margin-top:7px}.btn{display:block;text-align:center;padding:10px;background:#168653;color:#fff;text-decoration:none;border-radius:8px;font-size:13px;margin-top:10px}.empty{color:#73777d;padding:20px}@media(min-width:700px){header{padding:18px 24px}main{padding:30px 24px}.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}</style></head><body><header><div class="wrap"><a class="logo" href="./">♪ Malayalam Music</a><nav><a href="./">Home</a><a href="singers.html">Singers</a><a href="music-directors.html">Music Directors</a></nav></div></header><main><h1 id="heading">Music Directors</h1><input id="search" placeholder="Search..." aria-label="Search"><div id="content" class="grid"></div></main>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCiQ71SaooetywbZQxZs7PpqYoz8cWOZrI",
  authDomain: "malayalam-music-website.firebaseapp.com",
  projectId: "malayalam-music-website",
  storageBucket: "malayalam-music-website.firebasestorage.app",
  messagingSenderId: "1046190707332",
  appId: "1:1046190707332:web:a6b30072d7784c7db128d1"
};

const app=initializeApp(firebaseConfig),db=getFirestore(app),$=id=>document.getElementById(id),selected=new URLSearchParams(location.search).get("name"),fallback="https://placehold.co/500x500/f0f0f0/777?text=Music";
const isSinger=false, field=isSinger?"singer":"music", personColl=isSinger?"singers":"musicDirectors",pageFile=isSinger?"singers.html":"music-directors.html";let songs=[],people=[];
if(selected){$("heading").textContent=selected+" — Songs";$("search").placeholder="Search songs by "+selected+"..."}
function names(v){return String(v||"").split(",").map(x=>x.trim()).filter(Boolean)}
function render(){const el=$("content"),q=$("search").value.trim().toLowerCase();el.replaceChildren();
 if(selected){const rows=songs.filter(s=>names(s[field]).some(n=>n.toLowerCase()===selected.toLowerCase())&&[s.title,s.album,s.year].join(" ").toLowerCase().includes(q));if(!rows.length){el.className="";el.textContent="No songs found for this name.";return}el.className="grid";rows.forEach(s=>{const c=document.createElement("article");c.className="card";c.innerHTML='<img class="cover" alt=""><div class="info"><a class="name"></a><div class="sub"></div><a class="btn">Song Details</a></div>';c.querySelector("img").src=s.cover||fallback;c.querySelector("img").alt=s.title||"Song";c.querySelector(".name").textContent=s.title||"Untitled";c.querySelector(".name").href="song.html?id="+encodeURIComponent(s.id||s.docId);c.querySelector(".sub").textContent=[s.album,s.year].filter(Boolean).join(" · ");c.querySelector(".btn").href="song.html?id="+encodeURIComponent(s.id||s.docId);el.append(c)});return}
 const map=new Map();songs.forEach(s=>names(s[field]).forEach(n=>{if(!map.has(n))map.set(n,{name:n,image:s.cover})}));people.forEach(p=>{const n=p.name||p.id;if(n)map.set(n,{name:n,image:p.image||map.get(n)?.image})});
 const rows=[...map.values()].filter(p=>p.name.toLowerCase().includes(q));if(!rows.length){el.className="";el.textContent="No names found yet.";return}el.className="grid";rows.forEach(p=>{const count=songs.filter(s=>names(s[field]).some(n=>n.toLowerCase()===p.name.toLowerCase())).length,c=document.createElement("article");c.className="card";c.innerHTML='<img class="cover" alt=""><div class="info"><a class="name"></a><div class="sub"></div><a class="btn">View Songs</a></div>';c.querySelector("img").src=p.image||fallback;c.querySelector("img").alt=p.name;c.querySelector(".name").textContent=p.name;c.querySelector(".name").href=pageFile+"?name="+encodeURIComponent(p.name);c.querySelector(".sub").textContent="Songs: "+count;c.querySelector(".btn").href=pageFile+"?name="+encodeURIComponent(p.name);el.append(c)});
}
$("search").addEventListener("input",render);
try{const [s,p]=await Promise.all([getDocs(collection(db,"songs")),getDocs(collection(db,personColl))]);songs=s.docs.map(d=>({...d.data(),docId:d.id,id:d.data().id||d.id}));people=p.docs.map(d=>({...d.data(),docId:d.id}));render()}catch(e){console.error(e);$("content").textContent="Could not load data. Check Firestore Rules."}
</script></body></html>
