<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Malayalam Music</title>
<style>
:root{--green:#168653;--dark:#106b42;--text:#202124;--muted:#73777d;--border:#e8eaed}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#fff}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--border);padding:16px 18px}
.wrap{max-width:1200px;margin:auto}.logo{font-size:22px;font-weight:700;color:var(--green);text-decoration:none}
#search{width:100%;margin-top:14px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px;outline:none}
#search:focus{border-color:var(--green)}main{max-width:1200px;margin:auto;padding:24px 18px 36px}
h2{font-size:20px;margin:4px 0 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{border:1px solid var(--border);border-radius:12px;overflow:hidden;min-width:0}.cover-link{display:block}
.cover{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#f0f0f0}
.info{padding:10px}.song-title{display:block;font-size:14px;line-height:1.4;font-weight:700;color:var(--text);text-decoration:none;margin-bottom:5px;overflow-wrap:anywhere}
.song-title:hover{color:var(--green)}.year{font-size:12px;color:var(--muted);margin:0 0 10px}
.actions{display:grid;grid-template-columns:1fr;gap:7px}.btn{border:0;border-radius:8px;padding:10px 8px;min-height:38px;font-size:13px;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;cursor:pointer}
.play{background:var(--green);color:#fff}.download{background:#eef7f1;color:var(--dark)}.empty{grid-column:1/-1;padding:24px;text-align:center;border:1px dashed var(--border);border-radius:12px;color:var(--muted)}
footer{text-align:center;padding:24px 12px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}
@media(min-width:700px){header{padding:18px 24px}.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}main{padding:28px 24px 40px}.actions{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="./">♪ Malayalam Music</a><input id="search" type="search" placeholder="Search songs or albums..." aria-label="Search songs"></div></header>
<main><h2>Latest Songs</h2><div class="grid" id="songs"></div></main>
<footer>Malayalam Music · Home · Songs · Albums · Singers</footer>
<script>
/*
  EDIT SONG DATA HERE.
  youtubeUrl = official YouTube video link for streaming on the song details page.
  driveId = Google Drive FILE ID for an audio file you own or have permission to distribute.
*/
const music = [
  {
    id: "maanthrikam",
    title: "Maanthrikam",
    album: "Bethlehem Kudumba Unit",
    year: "2026",
    singer: "Add Singer Name",
    music: "Add Music Director",
    director: "Add Director",
    cover: "https://placehold.co/500x500/f0f0f0/777?text=Album",
    youtubeUrl: "https://youtube.com/watch?v=wLG9P297wLg&pp=iggCQAE%3D",
    driveId: "https://drive.usercontent.google.com/download?id=1a9V7Ud4-dbMnOaEWgmtBo4-5UdP6EW2u&export=download&confirm=t",
    details: "Add song details here."
  },
  {
    id: "sample-song-2",
    title: "Add Another Song",
    album: "Add Album Name",
    year: "2025",
    singer: "Add Singer Name",
    music: "Add Music Director",
    director: "Add Director",
    cover: "https://placehold.co/500x500/f0f0f0/777?text=Music",
    youtubeUrl: "https://youtu.be/wLG9P297wLg?si=ibBhFz6JskvbPgxu",
    driveId: "https://drive.usercontent.google.com/download?id=1a9V7Ud4-dbMnOaEWgmtBo4-5UdP6EW2u&export=download&confirm=t",
    details: ""
  }
];

const list = document.getElementById("songs");
const search = document.getElementById("search");
function render() {
  const q = search.value.trim().toLowerCase();
  list.replaceChildren();
  const filtered = music.filter(s => [s.title,s.album,s.year,s.singer].join(" ").toLowerCase().includes(q));
  if (!filtered.length) {
    const empty = document.createElement("div"); empty.className = "empty"; empty.textContent = "No songs found."; list.append(empty); return;
  }
  filtered.forEach(s => {
    const card = document.createElement("article"); card.className = "card";
    const coverLink = document.createElement("a"); coverLink.className = "cover-link"; coverLink.href = "song.html?id=" + encodeURIComponent(s.id);
    const img = document.createElement("img"); img.className = "cover"; img.src = s.cover; img.alt = s.title + " cover"; img.loading = "lazy";
    img.onerror = () => { img.onerror = null; img.src = "https://placehold.co/500x500/f0f0f0/777?text=Music"; };
    coverLink.append(img);
    const info = document.createElement("div"); info.className = "info";
    const title = document.createElement("a"); title.className = "song-title"; title.href = "song.html?id=" + encodeURIComponent(s.id); title.textContent = s.title;
    const year = document.createElement("p"); year.className = "year"; year.textContent = s.year;
    const actions = document.createElement("div"); actions.className = "actions";
    const view = document.createElement("a"); view.className = "btn play"; view.href = "song.html?id=" + encodeURIComponent(s.id); view.textContent = "Song Details";
    const dl = document.createElement("a"); dl.className = "btn download"; dl.textContent = "↓ Download";
    if (s.driveId) { dl.href = "https://drive.google.com/uc?export=download&id=" + encodeURIComponent(s.driveId); dl.target = "_blank"; dl.rel = "noopener noreferrer"; }
    else { dl.href = "#"; dl.addEventListener("click", e => { e.preventDefault(); alert("Add the Google Drive audio file ID first."); }); }
    actions.append(view,dl); info.append(title,year,actions); card.append(coverLink,info); list.append(card);
  });
}
search.addEventListener("input",render); render();
</script>
</body>
</html>
