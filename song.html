<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Song Details - Malayalam Music</title><style>
:root{--green:#168653;--dark:#106b42;--text:#202124;--muted:#73777d;--border:#e8eaed;--soft:#f7f9f8}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#fff}header{padding:16px 18px;border-bottom:1px solid var(--border);background:#fff}.wrap{max-width:1000px;margin:auto}.logo{color:var(--green);font-weight:700;font-size:22px;text-decoration:none}.back{display:inline-block;color:var(--muted);text-decoration:none;margin-top:14px;font-size:14px}nav{display:flex;gap:14px;margin-top:12px}nav a{color:#444;text-decoration:none;font-size:14px}main{max-width:1000px;margin:auto;padding:22px 16px 40px}.detail{display:grid;grid-template-columns:1fr;gap:20px}.poster{width:100%;max-width:360px;aspect-ratio:1;object-fit:cover;border-radius:14px;background:#eee}h1{font-size:25px;line-height:1.25;margin:0 0 8px}.subtitle{color:var(--muted);margin:0 0 18px}.meta{border-top:1px solid var(--border);margin-top:14px}.meta-row{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);font-size:14px}.meta-row strong{width:110px;flex-shrink:0}.meta-row span{overflow-wrap:anywhere}.buttons{display:grid;grid-template-columns:1fr;gap:10px;margin:18px 0}.btn{display:flex;align-items:center;justify-content:center;text-align:center;padding:13px 12px;border:0;border-radius:9px;font-size:14px;text-decoration:none;cursor:pointer;min-height:44px}.primary{background:var(--green);color:#fff}.secondary{background:#eef7f1;color:var(--dark)}.player-box{margin-top:22px;padding:14px;border:1px solid var(--border);border-radius:14px;background:var(--soft)}.player-box h2{font-size:18px;margin:0 0 12px}#youtubePlayer{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#111}#noVideo{display:none;padding:20px;text-align:center;background:#eee;border-radius:10px;color:#555}.description{line-height:1.6;font-size:14px;white-space:pre-wrap;margin-top:18px}footer{text-align:center;padding:24px 12px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}@media(min-width:700px){header{padding:18px 24px}main{padding:30px 24px 48px}.detail{grid-template-columns:minmax(240px,340px) 1fr;align-items:start}.buttons{grid-template-columns:1fr 1fr}.player-box{padding:18px}}</style></head><body><header><div class="wrap"><a class="logo" href="./">♪ Malayalam Music</a><br><a class="back" href="./">← Back to songs</a><nav><a href="singers.html">Singers</a><a href="music-directors.html">Music Directors</a></nav></div></header><main><div class="detail"><div><img id="cover" class="poster" src="https://placehold.co/500x500/f0f0f0/777?text=Music" alt="Album cover"></div><section><h1 id="title">Song Details</h1><p id="albumYear" class="subtitle"></p><div class="meta"><div class="meta-row"><strong>Album / Movie</strong><span id="album">—</span></div><div class="meta-row"><strong>Released</strong><span id="year">—</span></div><div class="meta-row"><strong>Singer</strong><span id="singer">—</span></div><div class="meta-row"><strong>Music</strong><span id="music">—</span></div><div class="meta-row"><strong>Director</strong><span id="director">—</span></div></div><div class="buttons"><a id="download" class="btn primary" href="#" target="_blank" rel="noopener noreferrer">↓ Direct Download</a><a id="openYouTube" class="btn secondary" href="#" target="_blank" rel="noopener noreferrer">▶ Open YouTube</a></div><div id="details" class="description"></div></section></div><section class="player-box"><h2>▶ Song Streaming</h2><iframe id="youtubePlayer" title="YouTube song player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><div id="noVideo">No YouTube video link has been added for this song.</div></section></main><footer>Malayalam Music · Song Details</footer>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCiQ71SaooetywbZQxZs7PpqYoz8cWOZrI",
  authDomain: "malayalam-music-website.firebaseapp.com",
  projectId: "malayalam-music-website",

const app=initializeApp(firebaseConfig),db=getFirestore(app),$=id=>document.getElementById(id),fallback="https://placehold.co/500x500/f0f0f0/777?text=Music";
function setText(id,v){$(id).textContent=v||"—"}function ytId(url){try{const u=new URL(url);if(u.hostname==="youtu.be")return u.pathname.slice(1).split("/")[0];if(u.pathname==="/watch")return u.searchParams.get("v")||"";const p=u.pathname.split("/").filter(Boolean);return ["embed","shorts","live"].includes(p[0])?p[1]||"":""}catch{return ""}}
function linkNames(id,value,page){const el=$(id);el.replaceChildren();const ns=String(value||"").split(",").map(x=>x.trim()).filter(Boolean);if(!ns.length){el.textContent="—";return}ns.forEach((n,i)=>{if(i)el.append(document.createTextNode(", "));const a=document.createElement("a");a.href=page+"?name="+encodeURIComponent(n);a.textContent=n;a.style.color="inherit";el.append(a)})}
try{const wanted=new URLSearchParams(location.search).get("id"),snap=await getDocs(collection(db,"songs")),d=snap.docs.find(x=>(x.data().id||x.id)===wanted);if(!d)throw new Error("Song not found");const s={...d.data(),id:d.data().id||d.id};document.title=(s.title||"Song")+" - Malayalam Music";setText("title",s.title);setText("albumYear",[s.album,s.year].filter(Boolean).join(" · "));setText("album",s.album);setText("year",s.year);setText("director",s.director);linkNames("singer",s.singer,"singers.html");linkNames("music",s.music,"music-directors.html");$("details").textContent=s.details||"";$("cover").src=s.cover||fallback;const dl=$("download");if(s.driveId)dl.href=String(s.driveId).startsWith("http")?s.driveId:"https://drive.google.com/uc?export=download&id="+encodeURIComponent(s.driveId);else dl.style.display="none";const id=ytId(s.youtubeUrl);if(id){$("youtubePlayer").src="https://www.youtube-nocookie.com/embed/"+encodeURIComponent(id);$("openYouTube").href="https://www.youtube.com/watch?v="+encodeURIComponent(id)}else{$("youtubePlayer").style.display="none";$("noVideo").style.display="block";$("openYouTube").style.display="none"}}catch(e){console.error(e);setText("title","Song not found or could not load")}
</script></body></html>
