<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Albums · Malayalam Music</title><style>
:root{--green:#168653;--dark:#106b42;--text:#202124;--muted:#73777d;--border:#e8eaed}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#fff}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--border);padding:16px 18px}.wrap{max-width:1200px;margin:auto}.logo{font-size:22px;font-weight:700;color:var(--green);text-decoration:none}nav{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}nav a{color:#444;text-decoration:none;font-size:14px}main{max-width:1200px;margin:auto;padding:24px 18px 36px}h1{font-size:24px;margin:4px 0 16px}#search{width:100%;margin:0 0 18px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid var(--border);border-radius:12px;overflow:hidden;min-width:0}.cover{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#f0f0f0}.info{padding:10px}.name{display:block;font-size:14px;line-height:1.4;font-weight:700;color:var(--text);text-decoration:none;overflow-wrap:anywhere}.sub{font-size:12px;color:var(--muted);margin:6px 0 10px}.btn{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 8px;background:#eef7f1;color:var(--dark);border-radius:8px;font-size:13px;text-decoration:none;min-height:38px}.empty{grid-column:1/-1;padding:20px;text-align:center;border:1px dashed var(--border);border-radius:12px;color:var(--muted)}.details{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start;margin:12px 0 22px}.poster{display:block;width:100%;max-width:420px;aspect-ratio:1;object-fit:cover;border-radius:6px;background:#f0f0f0;border:1px solid var(--border)}.albumInfo{min-width:0}.albumTitle{font-size:22px;line-height:1.3;margin:0 0 14px}.meta{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff}.metaRow{display:grid;grid-template-columns:38% 62%;gap:10px;padding:15px 16px;border-bottom:1px solid var(--border);align-items:center}.metaRow:last-child{border-bottom:0}.metaLabel{font-size:12px;font-weight:800;letter-spacing:.07em;color:#6f7885}.metaValue{font-size:15px;font-weight:600;overflow-wrap:anywhere}.downloadAll{display:flex;justify-content:center;align-items:center;gap:8px;width:min(100%,420px);margin:22px auto 28px;padding:17px 16px;background:#249b5b;color:white;border-radius:9px;text-decoration:none;font-weight:700;font-size:17px;box-shadow:0 5px 14px #249b5b22}.downloadAll.disabled{display:none}.songSectionBox{border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:22px}.songSectionBox h2{font-size:23px;margin:0 0 16px}.songs{display:grid;gap:10px}.song{padding:13px 14px;background:#e6f1f8;border:1px solid #d9e7f1;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}.songLeft{display:flex;align-items:center;gap:14px;min-width:0}.songNumber{width:40px;height:40px;flex:0 0 40px;border-radius:50%;display:grid;place-items:center;background:#1594bb;color:#fff;font-weight:700}.songText{min-width:0}.songTitle{font-weight:700;overflow-wrap:anywhere}.songSub{font-size:13px;color:#65717e;margin-top:5px}.song a{display:inline-flex;justify-content:center;align-items:center;background:#168db6;color:white;font-weight:700;text-decoration:none;border-radius:7px;padding:12px 16px;white-space:nowrap}.song a.detailsLink{background:transparent;color:var(--dark);padding:8px}@media(min-width:700px){header{padding:18px 24px}.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}main{padding:28px 24px 40px}.details{grid-template-columns:minmax(280px,34%) 1fr;gap:28px}.poster{max-width:100%}.albumTitle{font-size:26px}.metaRow{padding:18px 20px;grid-template-columns:220px 1fr}.songSectionBox{padding:24px}.songTitle{font-size:16px}}@media(max-width:480px){.metaRow{grid-template-columns:1fr;gap:5px;padding:12px}.downloadAll{font-size:15px}.song{align-items:flex-start}.song a{padding:10px;font-size:12px}.songNumber{width:34px;height:34px;flex-basis:34px}.songSectionBox{padding:12px}}
</style></head><body><header><div class="wrap"><a class="logo" href="./">♪ Malayalam Music</a><nav><a href="./">Home</a><a href="album.html">Albums</a><a href="singers.html">Singers</a><a href="music-directors.html">Music Directors</a></nav></div></header><main><h1 id="heading">Albums</h1><input id="search" type="search" placeholder="Search albums..." aria-label="Search albums"><div id="content" class="grid"><div class="empty">Loading albums…</div></div><section id="songSection" class="songSectionBox" hidden><h2 id="songHeading">Songs List</h2><div id="songList" class="songs"></div></section></main>
<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";import{getFirestore,collection,getDocs,doc,getDoc}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyCiQ71SaooetywbZQxZs7PpqYoz8cWOZrI",authDomain:"malayalam-music-website.firebaseapp.com",projectId:"malayalam-music-website",storageBucket:"malayalam-music-website.firebasestorage.app",messagingSenderId:"1046190707332",appId:"1:1046190707332:web:a6b30072d7784c7db128d1"};const db=getFirestore(initializeApp(firebaseConfig)),content=document.getElementById("content"),search=document.getElementById("search"),heading=document.getElementById("heading"),params=new URLSearchParams(location.search),selected=params.get("id"),fallback="https://placehold.co/500x500/f0f0f0/777?text=Album";let albums=[];function card(a){const c=document.createElement("article");c.className="card";const img=document.createElement("img");img.className="cover";img.src=a.imageUrl||a.cover||fallback;img.alt=a.name||"Album";img.loading="lazy";img.onerror=()=>{img.onerror=null;img.src=fallback};const info=document.createElement("div");info.className="info";const name=document.createElement("a");name.className="name";name.textContent=a.name||"Untitled Album";name.href="album.html?id="+encodeURIComponent(a.docId);const sub=document.createElement("div");sub.className="sub";sub.textContent=[a.year,a.totalTracks? a.totalTracks+" Songs":""].filter(Boolean).join(" · ");const btn=document.createElement("a");btn.className="btn";btn.href=name.href;btn.textContent="View Album";info.append(name,sub,btn);c.append(img,info);return c}function render(){const q=search.value.trim().toLowerCase(),arr=albums.filter(a=>[a.name,a.year,a.director,a.starring].join(" ").toLowerCase().includes(q));content.replaceChildren();if(!arr.length){const e=document.createElement("div");e.className="empty";e.textContent="No albums found.";content.append(e)}else arr.forEach(a=>content.append(card(a)))}async function showAlbum(){
 content.className="";
 content.replaceChildren();
 search.hidden=true;
 try{
  const snap=await getDoc(doc(db,"albums",selected));
  if(!snap.exists()){heading.textContent="Album not found";content.innerHTML='<div class="empty">This album could not be found.</div>';return}
  const a={...snap.data(),docId:snap.id};
  heading.textContent=(a.name||"Album")+(a.year?" ("+a.year+") songs Download":"");
  const wrap=document.createElement("div");wrap.className="details";
  const img=document.createElement("img");img.className="poster";img.src=a.imageUrl||a.cover||fallback;img.alt=a.name||"Album";img.onerror=()=>{img.onerror=null;img.src=fallback};
  const info=document.createElement("div");info.className="albumInfo";
  const title=document.createElement("h2");title.className="albumTitle";title.textContent=a.name||"Album";
  const meta=document.createElement("div");meta.className="meta";
  const fields=[["MUSIC DIRECTOR",a.musicDirector||a.music||""],["DIRECTOR",a.director||""],["STARRING",a.starring||""],["TOTAL TRACKS",a.totalTracks??""],["RELEASED",a.released||""]];
  fields.forEach(([label,value])=>{if(value!==""&&value!==null&&value!==undefined){const row=document.createElement("div");row.className="metaRow";const l=document.createElement("div");l.className="metaLabel";l.textContent=label;const v=document.createElement("div");v.className="metaValue";v.textContent=label==="RELEASED"&&/^\\d{4}-\\d{2}-\\d{2}$/.test(String(value))?new Date(String(value)+"T00:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}):String(value);row.append(l,v);meta.append(row)}});
  const allAlbums=document.createElement("a");allAlbums.className="btn";allAlbums.href="album.html";allAlbums.textContent="All Albums";allAlbums.style.maxWidth="180px";allAlbums.style.marginTop="12px";
  info.append(title,meta,allAlbums);wrap.append(img,info);content.append(wrap);
  const downloadAll=document.createElement("a");downloadAll.className="downloadAll";downloadAll.href=a.zipUrl||a.downloadAllUrl||"#";downloadAll.textContent="⇩ Download All Songs (ZIP)";
  if(a.zipUrl||a.downloadAllUrl){downloadAll.target="_blank";downloadAll.rel="noopener"}else downloadAll.hidden=true;
  content.append(downloadAll);
  const all=await getDocs(collection(db,"songs"));
  const matched=all.docs.map(d=>({...d.data(),docId:d.id})).filter(song=>String(song.album||"").trim().toLowerCase()===String(a.name||"").trim().toLowerCase());
  const section=document.getElementById("songSection");section.hidden=false;
  document.getElementById("songHeading").textContent="Songs List";
  const list=document.getElementById("songList");list.replaceChildren();
  if(!matched.length){list.innerHTML='<div class="empty">No songs linked to this album yet. Make sure the song Album / Movie field matches the album name.</div>';return}
  matched.forEach((song,index)=>{
   const row=document.createElement("div");row.className="song";
   const left=document.createElement("div");left.className="songLeft";
   const number=document.createElement("div");number.className="songNumber";number.textContent=String(index+1);
   const textBox=document.createElement("div");textBox.className="songText";
   const name=document.createElement("div");name.className="songTitle";name.textContent=song.title||"Untitled Song";
   const sub=document.createElement("div");sub.className="songSub";sub.textContent=["Singer: "+(song.singer||"Unknown"),song.music||"",song.duration?"Duration: "+song.duration:"",song.year||""].filter(Boolean).join(" | ");
   textBox.append(name,sub);left.append(number,textBox);
   const downloadUrl=song.downloadUrl||song.downloadLink||(song.driveId?"https://drive.google.com/uc?export=download&id="+encodeURIComponent(song.driveId):"");
   const link=document.createElement("a");
   if(downloadUrl){link.href=downloadUrl;link.textContent="⇩ Download";link.target="_blank";link.rel="noopener"}else{link.href="song.html?id="+encodeURIComponent(song.id||song.docId);link.textContent="Song Details";link.className="detailsLink"}
   row.append(left,link);list.append(row);
  });
 }catch(e){console.error(e);content.innerHTML='<div class="empty">Could not load album data. Check Firestore Rules.</div>'}
}
search.addEventListener("input",render);try{const snap=await getDocs(collection(db,"albums"));albums=snap.docs.map(d=>({...d.data(),docId:d.id})).sort((a,b)=>Number(b.year||0)-Number(a.year||0));if(selected)await showAlbum();else render()}catch(e){console.error(e);content.innerHTML='<div class="empty">Could not load albums. Check Firestore Rules and the albums collection.</div>'}</script></body></html>
