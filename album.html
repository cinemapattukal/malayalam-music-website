<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Albums · Malayalam Music</title><style>
:root{--green:#168653;--dark:#106b42;--text:#202124;--muted:#73777d;--border:#e8eaed}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#fff}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--border);padding:16px 18px}.wrap{max-width:1200px;margin:auto}.logo{font-size:22px;font-weight:700;color:var(--green);text-decoration:none}nav{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}nav a{color:#444;text-decoration:none;font-size:14px}main{max-width:1200px;margin:auto;padding:24px 18px 36px}h1{font-size:24px;margin:4px 0 16px}#search{width:100%;margin:0 0 18px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid var(--border);border-radius:12px;overflow:hidden;min-width:0}.cover{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#f0f0f0}.info{padding:10px}.name{display:block;font-size:14px;line-height:1.4;font-weight:700;color:var(--text);text-decoration:none;overflow-wrap:anywhere}.sub{font-size:12px;color:var(--muted);margin:6px 0 10px}.btn{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 8px;background:#eef7f1;color:var(--dark);border-radius:8px;font-size:13px;text-decoration:none;min-height:38px}.empty{grid-column:1/-1;padding:20px;text-align:center;border:1px dashed var(--border);border-radius:12px;color:var(--muted)}.details{display:grid;grid-template-columns:1fr;gap:20px;margin-bottom:24px}.poster{width:100%;max-width:360px;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#f0f0f0}.meta{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin:18px 0 16px}.meta-row{display:grid;grid-template-columns:minmax(110px,32%) 1fr;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border);align-items:start}.meta-row:last-child{border-bottom:0}.meta-label{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}.meta-value{font-size:15px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}.zip-btn{display:flex;align-items:center;justify-content:center;max-width:420px;min-height:52px;margin:24px auto 30px;padding:14px 20px;border-radius:8px;background:#249b62;color:#fff;font-weight:700;text-decoration:none;text-align:center}.songs-box{border:1px solid var(--border);border-radius:14px;padding:18px}#songSection h2{font-size:24px;margin:26px 0 16px}.songs{display:grid;gap:10px}.song{padding:14px 16px;background:#eaf5fb;border:1px solid #d9eaf4;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:14px}.song-main{display:flex;align-items:center;gap:14px;min-width:0;flex:1}.song-number{flex:0 0 42px;width:42px;height:42px;border-radius:50%;background:#20a8cf;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}.song-copy{min-width:0}.song-title{font-weight:700;line-height:1.4;overflow-wrap:anywhere}.song-sub{font-size:13px;color:#8a969f;margin-top:5px;line-height:1.4}.song a{background:#1598bd;color:#fff;padding:12px 18px;border-radius:6px;font-weight:700;text-decoration:none;white-space:nowrap;flex-shrink:0}@media(max-width:520px){main{padding:18px 16px 28px}.details{grid-template-columns:1fr;gap:14px}.poster{width:100%;max-width:100%;aspect-ratio:1;object-fit:cover}.meta{margin:0 0 14px}.meta-row{grid-template-columns:minmax(100px,34%) minmax(0,1fr);gap:10px;padding:15px 14px}.meta-label{font-size:11px}.meta-value{font-size:15px;line-height:1.45}.zip-btn{width:100%;max-width:none;margin:18px auto 24px;min-height:52px}.songs-box{padding:12px;border:0}.song{padding:12px;gap:8px}.song-main{gap:10px}.song-number{width:36px;height:36px;flex-basis:36px}.song a{padding:10px 12px;font-size:13px}.song-title{font-size:14px}.song-sub{font-size:12px}}@media(min-width:700px){header{padding:18px 24px}.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}main{padding:28px 24px 40px}.details{grid-template-columns:minmax(260px,34%) 1fr;align-items:start;gap:24px}.poster{max-width:100%}.meta-row{grid-template-columns: minmax(160px,30%) 1fr;padding:18px 22px}}
</style></head><body><header><div class="wrap"><a class="logo" href="./">♪ Malayalam Music</a><nav><a href="./">Home</a><a href="album.html">Albums</a><a href="singers.html">Singers</a><a href="music-directors.html">Music Directors</a></nav></div></header><main><h1 id="heading">Albums</h1><input id="search" type="search" placeholder="Search albums..." aria-label="Search albums"><div id="content" class="grid"><div class="empty">Loading albums…</div></div><section id="songSection" hidden><h2 id="songHeading">Songs</h2><div id="songList" class="songs"></div></section></main>
<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";import{getFirestore,collection,getDocs,doc,getDoc}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyCiQ71SaooetywbZQxZs7PpqYoz8cWOZrI",authDomain:"malayalam-music-website.firebaseapp.com",projectId:"malayalam-music-website",storageBucket:"malayalam-music-website.firebasestorage.app",messagingSenderId:"1046190707332",appId:"1:1046190707332:web:a6b30072d7784c7db128d1"};const db=getFirestore(initializeApp(firebaseConfig)),content=document.getElementById("content"),search=document.getElementById("search"),heading=document.getElementById("heading"),params=new URLSearchParams(location.search),selected=params.get("id"),fallback="https://placehold.co/500x500/f0f0f0/777?text=Album";let albums=[];function card(a){const c=document.createElement("article");c.className="card";const img=document.createElement("img");img.className="cover";img.src=a.imageUrl||a.cover||fallback;img.alt=a.name||"Album";img.loading="lazy";img.onerror=()=>{img.onerror=null;img.src=fallback};const info=document.createElement("div");info.className="info";const name=document.createElement("a");name.className="name";name.textContent=a.name||"Untitled Album";name.href="album.html?id="+encodeURIComponent(a.docId);const sub=document.createElement("div");sub.className="sub";sub.textContent=[a.year,a.totalTracks? a.totalTracks+" Songs":""].filter(Boolean).join(" · ");const btn=document.createElement("a");btn.className="btn";btn.href=name.href;btn.textContent="View Album";info.append(name,sub,btn);c.append(img,info);return c}function render(){const q=search.value.trim().toLowerCase(),arr=albums.filter(a=>[a.name,a.year,a.director,a.starring].join(" ").toLowerCase().includes(q));content.replaceChildren();if(!arr.length){const e=document.createElement("div");e.className="empty";e.textContent="No albums found.";content.append(e)}else arr.forEach(a=>content.append(card(a)))}async function showAlbum(){content.className="";content.replaceChildren();search.hidden=true;try{const snap=await getDoc(doc(db,"albums",selected));if(!snap.exists()){heading.textContent="Album not found";content.innerHTML='<div class="empty">This album could not be found.</div>';return}const a={...snap.data(),docId:snap.id};heading.textContent=a.name||"Album";const wrap=document.createElement("div");wrap.className="details";const img=document.createElement("img");img.className="poster";img.src=a.imageUrl||a.cover||fallback;img.alt=a.name||"Album";img.onerror=()=>{img.onerror=null;img.src=fallback};const info=document.createElement("div");const meta=document.createElement("div");meta.className="meta";function formatReleased(value){if(!value)return "";const raw=String(value).trim();let d;if(/^\d{4}-\d{2}-\d{2}$/.test(raw)){const [y,m,day]=raw.split("-").map(Number);d=new Date(y,m-1,day,12)}else if(/^\d{4}-\d{2}$/.test(raw)){const [y,m]=raw.split("-").map(Number);d=new Date(y,m-1,1,12)}else{d=new Date(raw)}if(Number.isNaN(d.getTime()))return raw;return new Intl.DateTimeFormat("en-US",{month:"long",day:"numeric",year:"numeric",timeZone:"UTC"}).format(new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),12)))}function addMeta(label,value){if(value===undefined||value===null||String(value).trim()==="")return;const row=document.createElement("div");row.className="meta-row";const l=document.createElement("div");l.className="meta-label";l.textContent=label;const v=document.createElement("div");v.className="meta-value";v.textContent=value;row.append(l,v);meta.append(row)}addMeta("MUSIC DIRECTOR",a.musicDirector||a.music||a.music_director||"—");addMeta("DIRECTOR",a.director||"");addMeta("STARRING",a.starring||"");addMeta("TOTAL TRACKS",a.totalTracks||"");addMeta("RELEASED",formatReleased(a.released)||"");info.append(meta);wrap.append(img,info);content.append(wrap);const zip=document.createElement("a");zip.className="zip-btn";zip.textContent="↓ Download All Songs (ZIP)";if(a.zipUrl||a.downloadAllUrl){zip.href=a.zipUrl||a.downloadAllUrl;zip.target="_blank";zip.rel="noopener"}else{zip.href="#";zip.addEventListener("click",e=>{e.preventDefault();alert("Admin Panel-ൽ ഈ album-ന്റെ ZIP download URL ചേർക്കുക.")})}content.append(zip);const all=await getDocs(collection(db,"songs"));const matched=all.docs.map(d=>({...d.data(),docId:d.id})).filter(s=>String(s.album||"").trim().toLowerCase()===String(a.name||"").trim().toLowerCase());document.getElementById("songSection").hidden=false;document.getElementById("songHeading").textContent="Songs List";const list=document.getElementById("songList");list.replaceChildren();list.className="songs-box songs";if(!matched.length){list.innerHTML='<div class="empty">No songs linked to this album yet. Make sure the song Album / Movie field matches the album name.</div>';return}matched.forEach((s,index)=>{const row=document.createElement("div");row.className="song";const main=document.createElement("div");main.className="song-main";const number=document.createElement("div");number.className="song-number";number.textContent=String(index+1);const copy=document.createElement("div");copy.className="song-copy";const name=document.createElement("div");name.className="song-title";name.textContent=s.title||"Untitled Song";const sub=document.createElement("div");sub.className="song-sub";const meta=[s.singer||s.singers,s.duration?"Duration: "+s.duration:""].filter(Boolean).join(" | ");sub.textContent=meta;copy.append(name);if(meta)copy.append(sub);main.append(number,copy);const link=document.createElement("a");link.href=s.downloadUrl||s.downloadLink||s.audioUrl||("song.html?id="+encodeURIComponent(s.id||s.docId));link.textContent="↓ Download";if(/^https?:/.test(link.href)&&!link.href.includes(location.host)){link.target="_blank";link.rel="noopener"}row.append(main,link);list.append(row)})}catch(e){console.error(e);content.innerHTML='<div class="empty">Could not load album data. Check Firestore Rules.</div>'}}search.addEventListener("input",render);try{const snap=await getDocs(collection(db,"albums"));albums=snap.docs.map(d=>({...d.data(),docId:d.id})).sort((a,b)=>Number(b.year||0)-Number(a.year||0));if(selected)await showAlbum();else render()}catch(e){console.error(e);content.innerHTML='<div class="empty">Could not load albums. Check Firestore Rules and the albums collection.</div>'}</script></body></html>
