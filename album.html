<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Albums · Malayalam Music</title><style>
:root{--green:#168653;--dark:#106b42;--text:#202124;--muted:#73777d;--border:#e8eaed}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#fff}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--border);padding:16px 18px}.wrap{max-width:1200px;margin:auto}.logo{font-size:22px;font-weight:700;color:var(--green);text-decoration:none}nav{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}nav a{color:#444;text-decoration:none;font-size:14px}main{max-width:1200px;margin:auto;padding:24px 18px 36px}h1{font-size:24px;margin:4px 0 16px}#search{width:100%;margin:0 0 18px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid var(--border);border-radius:12px;overflow:hidden;min-width:0}.cover{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#f0f0f0}.info{padding:10px}.name{display:block;font-size:14px;line-height:1.4;font-weight:700;color:var(--text);text-decoration:none;overflow-wrap:anywhere}.sub{font-size:12px;color:var(--muted);margin:6px 0 10px}.btn{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 8px;background:#eef7f1;color:var(--dark);border-radius:8px;font-size:13px;text-decoration:none;min-height:38px}.empty{grid-column:1/-1;padding:20px;text-align:center;border:1px dashed var(--border);border-radius:12px;color:var(--muted)}.details{display:grid;grid-template-columns:1fr;gap:20px}.poster{width:100%;max-width:360px;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#f0f0f0}.meta{color:var(--muted);line-height:1.8}.songs{display:grid;gap:10px}.song{padding:14px;border:1px solid var(--border);border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}.song a{color:var(--dark);font-weight:700;text-decoration:none}@media(min-width:700px){header{padding:18px 24px}.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}main{padding:28px 24px 40px}.details{grid-template-columns:300px 1fr;align-items:start}.poster{max-width:300px}}
</style></head><body><header><div class="wrap"><a class="logo" href="./">♪ Malayalam Music</a><nav><a href="./">Home</a><a href="album.html">Albums</a><a href="singers.html">Singers</a><a href="music-directors.html">Music Directors</a></nav></div></header><main><h1 id="heading">Albums</h1><input id="search" type="search" placeholder="Search albums..." aria-label="Search albums"><div id="content" class="grid"><div class="empty">Loading albums…</div></div><section id="songSection" hidden><h2 id="songHeading">Songs</h2><div id="songList" class="songs"></div></section></main>
<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";import{getFirestore,collection,getDocs,doc,getDoc}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyCiQ71SaooetywbZQxZs7PpqYoz8cWOZrI",authDomain:"malayalam-music-website.firebaseapp.com",projectId:"malayalam-music-website",storageBucket:"malayalam-music-website.firebasestorage.app",messagingSenderId:"1046190707332",appId:"1:1046190707332:web:a6b30072d7784c7db128d1"};const db=getFirestore(initializeApp(firebaseConfig)),content=document.getElementById("content"),search=document.getElementById("search"),heading=document.getElementById("heading"),params=new URLSearchParams(location.search),selected=params.get("id"),fallback="https://placehold.co/500x500/f0f0f0/777?text=Album";let albums=[];function card(a){const c=document.createElement("article");c.className="card";const img=document.createElement("img");img.className="cover";img.src=a.imageUrl||a.cover||fallback;img.alt=a.name||"Album";img.loading="lazy";img.onerror=()=>{img.onerror=null;img.src=fallback};const info=document.createElement("div");info.className="info";const name=document.createElement("a");name.className="name";name.textContent=a.name||"Untitled Album";name.href="album.html?id="+encodeURIComponent(a.docId);const sub=document.createElement("div");sub.className="sub";sub.textContent=[a.year,a.totalTracks? a.totalTracks+" Songs":""].filter(Boolean).join(" · ");const btn=document.createElement("a");btn.className="btn";btn.href=name.href;btn.textContent="View Album";info.append(name,sub,btn);c.append(img,info);return c}function render(){const q=search.value.trim().toLowerCase(),arr=albums.filter(a=>[a.name,a.year,a.director,a.starring].join(" ").toLowerCase().includes(q));content.replaceChildren();if(!arr.length){const e=document.createElement("div");e.className="empty";e.textContent="No albums found.";content.append(e)}else arr.forEach(a=>content.append(card(a)))}async function showAlbum(){content.className="";content.innerHTML='<div class="empty">Loading album…</div>';search.hidden=true;try{const snap=await getDoc(doc(db,"albums",selected));if(!snap.exists()){heading.textContent="Album not found";content.innerHTML='<div class="empty">This album could not be found.</div>';return}const a={...snap.data(),docId:snap.id};heading.textContent=a.name||"Album";const wrap=document.createElement("div");wrap.className="details";const img=document.createElement("img");img.className="poster";img.src=a.imageUrl||a.cover||fallback;img.alt=a.name||"Album";img.onerror=()=>{img.onerror=null;img.src=fallback};const info=document.createElement("div");const title=document.createElement("h2");title.textContent=a.name||"Album";const meta=document.createElement("div");meta.className="meta";meta.textContent=[a.year?"Year: "+a.year:"",a.totalTracks?"Total Tracks: "+a.totalTracks:"",a.director?"Director: "+a.director:"",a.starring?"Starring: "+a.starring:"",a.released?"Released: "+a.released:""].filter(Boolean).join(" · ");const back=document.createElement("a");back.className="btn";back.href="album.html";back.textContent="All Albums";back.style.maxWidth="180px";info.append(title,meta,back);wrap.append(img,info);content.append(wrap);const all=await getDocs(collection(db,"songs"));const matched=all.docs.map(d=>({...d.data(),docId:d.id})).filter(s=>String(s.album||"").trim().toLowerCase()===String(a.name||"").trim().toLowerCase());document.getElementById("songSection").hidden=false;document.getElementById("songHeading").textContent="Songs in "+(a.name||"this album");const list=document.getElementById("songList");list.replaceChildren();if(!matched.length){list.innerHTML='<div class="empty">No songs linked to this album yet. Make sure the song Album / Movie field matches the album name.</div>';return}matched.forEach(s=>{const row=document.createElement("div");row.className="song";const left=document.createElement("div");const name=document.createElement("div");name.textContent=s.title||"Untitled Song";name.style.fontWeight="700";const sub=document.createElement("div");sub.className="sub";sub.textContent=[s.singer,s.year].filter(Boolean).join(" · ");left.append(name,sub);const link=document.createElement("a");link.href="song.html?id="+encodeURIComponent(s.id||s.docId);link.textContent="Song Details";row.append(left,link);list.append(row)})}catch(e){console.error(e);content.innerHTML='<div class="empty">Could not load album data. Check Firestore Rules.</div>'}}search.addEventListener("input",render);try{const snap=await getDocs(collection(db,"albums"));albums=snap.docs.map(d=>({...d.data(),docId:d.id})).sort((a,b)=>Number(b.year||0)-Number(a.year||0));if(selected)await showAlbum();else render()}catch(e){console.error(e);content.innerHTML='<div class="empty">Could not load albums. Check Firestore Rules and the albums collection.</div>'}</script></body></html>
