<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Singers - Malayalam Music</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#202124}header{padding:16px 18px;border-bottom:1px solid #e8eaed}.wrap{max-width:1100px;margin:auto}.logo{font-size:22px;font-weight:bold;color:#168653;text-decoration:none}nav{display:flex;gap:16px;margin-top:14px}nav a{color:#444;text-decoration:none;font-size:14px}main{max-width:1100px;margin:auto;padding:24px 18px}h1{font-size:22px}input{width:100%;padding:12px;border:1px solid #e8eaed;border-radius:10px;margin:6px 0 18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:1px solid #e8eaed;border-radius:12px;overflow:hidden}.cover{width:100%;aspect-ratio:1;object-fit:cover;background:#eee}.info{padding:12px}.name{font-weight:bold;color:#202124;text-decoration:none}.sub{font-size:12px;color:#73777d;margin-top:7px}.btn{display:block;text-align:center;padding:10px;background:#168653;color:#fff;text-decoration:none;border-radius:8px;font-size:13px;margin-top:10px}.empty{color:#73777d;padding:20px}@media(min-width:700px){header{padding:18px 24px}main{padding:30px 24px}.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
</style></head><body><header><div class="wrap"><a class="logo" href="./">♪ Malayalam Music</a><nav><a href="./">Home</a><a href="singers.html">Singers</a><a href="music-directors.html">Music Directors</a></nav></div></header><main><h1 id="heading">Singers</h1><input id="search" placeholder="Search singers..." aria-label="Search singers"><div id="content" class="grid"></div></main>
<script>
const songs=[
{title:"Maanthrikam",id:"maanthrikam",singer:"Vishnu Vijay",year:"2026",cover:"https://placehold.co/500x500/f0f0f0/777?text=Vishnu+Vijay"},
 {title:"Maanthrikam",id:"maanthrikam",singer:"Aparna Harikumar",year:"2026",cover:"https://placehold.co/500x500/f0f0f0/777?text=Aparna+Harikumar"},
{title:"Add Another Song",id:"sample-song-2",singer:"Add Singer Name",year:"2025",cover:"https://placehold.co/500x500/f0f0f0/777?text=Singer"}
];
const content=document.getElementById("content"),search=document.getElementById("search"),params=new URLSearchParams(location.search),selected=params.get("name");
if(selected){document.getElementById("heading").textContent=selected+" — Songs";search.placeholder="Search songs by "+selected+"..."}
function render(){content.replaceChildren();const q=search.value.toLowerCase().trim();
if(selected){const arr=songs.filter(s=>s.singer.split(",").map(n=>n.trim()).some(n=>n.toLowerCase()===selected.toLowerCase())&&[s.title,s.year].join(" ").toLowerCase().includes(q));if(!arr.length){content.className="";content.textContent="No songs found for this singer.";return}content.className="grid";arr.forEach(s=>{const c=document.createElement("article");c.className="card";c.innerHTML='<img class="cover" src="'+s.cover+'" alt=""><div class="info"><a class="name" href="song.html?id='+encodeURIComponent(s.id)+'"></a><div class="sub"></div><a class="btn" href="song.html?id='+encodeURIComponent(s.id)+'">Song Details</a></div>';c.querySelector(".name").textContent=s.title;c.querySelector(".sub").textContent=s.year;content.append(c)});return}
const map=new Map();songs.forEach(s=>{s.singer.split(",").map(n=>n.trim()).filter(Boolean).forEach(name=>{if(!map.has(name))map.set(name,{...s,singer:name})})});const arr=[...map.values()].filter(s=>s.singer.toLowerCase().includes(q));if(!arr.length){content.className="";content.textContent="No singers found.";return}content.className="grid";arr.forEach(s=>{const c=document.createElement("article");c.className="card";c.innerHTML='<img class="cover" alt=""><div class="info"><a class="name"></a><div class="sub"></div><a class="btn">View Songs</a></div>';c.querySelector("img").src=s.cover;c.querySelector("img").alt=s.singer;c.querySelector(".name").textContent=s.singer;c.querySelector(".name").href="singers.html?name="+encodeURIComponent(s.singer);c.querySelector(".sub").textContent="Songs: "+songs.filter(x=>x.singer.split(",").map(n=>n.trim()).some(n=>n===s.singer)).length;c.querySelector(".btn").href="singers.html?name="+encodeURIComponent(s.singer);content.append(c)})}
search.addEventListener("input",render);render();
</script></body></html>
